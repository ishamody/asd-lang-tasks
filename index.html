<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Speech & Articulation Experiments</title>

<style>
body {
  font-family: sans-serif;
  background: #f7f7f7;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  background: white;
  width: 650px;
  padding: 30px 40px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h1 { text-align: center; margin-top: 0; }

.experiment {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}

.experiment:last-child { border-bottom: none; }

.experiment a {
  font-weight: 600;
  color: #2563eb;
  text-decoration: none;
  pointer-events: none;
  opacity: 0.4;
}

.experiment a.enabled {
  pointer-events: auto;
  opacity: 1;
}

.check {
  transform: scale(1.2);
}

.footer {
  margin-top: 20px;
  text-align: center;
  font-size: 14px;
  color: #666;
}

#permissionScreen {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.permissionCard {
  background: white;
  padding: 30px;
  width: 500px;
  border-radius: 10px;
  text-align: center;
}

button {
  padding: 12px 20px;
  font-size: 16px;
  cursor: pointer;
}

#codeBox {
  margin-top: 25px;
  padding: 15px;
  background: #f0f9ff;
  border: 1px solid #bae6fd;
  border-radius: 8px;
  font-size: 18px;
  text-align: center;
  display: none;
}
</style>
</head>

<body>

<!-- PERMISSION OVERLAY -->
<div id="permissionScreen">
  <div class="permissionCard">
    <h2>Camera & Microphone Access</h2>
    <p>
      This study includes multiple experiments that require camera and microphone access.
    </p>
    <p>
      <b>Please select “Always allow”</b> when your browser asks for permission.
    </p>
    <button id="grantPermissions">Grant Permissions</button>
  </div>
</div>

<div class="card">
  <h1>Speech Experiments</h1>

  <div class="experiment">
    <label><input type="checkbox" class="check" disabled> Diadochokinetic Task</label>
    <a id="exp1" href="tasks/ptk-task/index.html">Start</a>
  </div>

  <div class="experiment">
    <label><input type="checkbox" class="check" disabled> Nonword Repetition Task</label>
    <a id="exp2" href="tasks/nonword-task/index.html">Start</a>
  </div>

  <div class="experiment">
    <label><input type="checkbox" class="check" disabled> Tongue Twister Task</label>
    <a id="exp3" href="tasks/tt-task/index.html">Start</a>
  </div>

  <div class="experiment">
    <label><input type="checkbox" class="check" disabled> Non-speech Oral Task</label>
    <a id="exp4" href="tasks/ns-oral-task/index.html">Start</a>
  </div>

  <div id="codeBox"></div>

  <div class="footer">
    Progress is saved automatically. Please complete experiments in order.
  </div>
</div>

<script>
/* ---------- PERMISSIONS ---------- */
const permScreen = document.getElementById("permissionScreen");

if (localStorage.getItem("permissionsGranted") === "true") {
  permScreen.style.display = "none";
}

document.getElementById("grantPermissions").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    stream.getTracks().forEach(t => t.stop());
    localStorage.setItem("permissionsGranted", "true");
    permScreen.style.display = "none";
    updateProgress();
  } catch {
    alert("You must allow camera and microphone access to continue.");
  }
};

/* ---------- EXPERIMENT ORDER ---------- */
const experiments = [
  { id: "exp1", key: "done_exp1" },
  { id: "exp2", key: "done_exp2" },
  { id: "exp3", key: "done_exp3" },
  { id: "exp4", key: "done_exp4" }
];

function updateProgress() {
  if (localStorage.getItem("permissionsGranted") !== "true") return;

  experiments.forEach((exp, i) => {
    const link = document.getElementById(exp.id);
    const checkbox = link.parentElement.querySelector(".check");

    if (i === 0 || localStorage.getItem(experiments[i-1].key) === "true") {
      link.classList.add("enabled");
    }

    if (localStorage.getItem(exp.key) === "true") {
      checkbox.checked = true;
    }
  });

  if (experiments.every(e => localStorage.getItem(e.key) === "true")) {
    showVerificationCode();
  }
}

/* ---------- VERIFICATION CODE ---------- */
function showVerificationCode() {
  let code = localStorage.getItem("verificationCode");
  if (!code) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    code = Array.from({length:16}, () => chars[Math.floor(Math.random()*chars.length)]).join("");
    localStorage.setItem("verificationCode", code);
  }

  const box = document.getElementById("codeBox");
  box.style.display = "block";
  box.innerHTML = `<b>Your verification code:</b><br>${code}`;
}

updateProgress();
</script>

</body>
</html>
