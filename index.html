<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Speech & Articulation Experiments</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      width: 600px;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .experiment {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .experiment:last-child {
      border-bottom: none;
    }

    .experiment a {
      text-decoration: none;
      font-weight: 600;
      color: #2563eb;
    }

    .experiment a:hover {
      text-decoration: underline;
    }

    .check {
      transform: scale(1.3);
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Speech Experiments</h1>

  <div class="experiment">
    <label>
      <input type="checkbox" class="check" data-key="nonword">
      Diadochokinetic Task
    </label>
    <a href="ptk-task/index.html">Start</a>
  </div>

  <div class="experiment">
    <label>
      <input type="checkbox" class="check" data-key="tonguetwister">
      Nonword Repetition Task
    </label>
    <a href="nonword-task/index.html">Start</a>
  </div>

  <div class="experiment">
    <label>
      <input type="checkbox" class="check" data-key="mouthmovement">
      Non-speech Oral Task
    </label>
    <a href="tt-task/index.html">Start</a>
  </div>

  <div class="experiment">
    <label>
      <input type="checkbox" class="check" data-key="mouthmovement">
      Mouth Movement Imitation Task
    </label>
    <a href="ns-oral-task/index.html">Start</a>
  </div>

  <div class="footer">
    Your progress is saved automatically in this browser.
  </div>
</div>

<script>
  // Persist checklist state using localStorage
  document.querySelectorAll('.check').forEach(box => {
    const key = box.dataset.key;
    box.checked = localStorage.getItem(key) === 'true';

    box.addEventListener('change', () => {
      localStorage.setItem(key, box.checked);
    });
  });
</script>

</body>
</html>
