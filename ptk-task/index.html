<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PTK Experiment</title>

<style>
body {
  background: white;
  color: black;
  font-size: 2em;
  text-align: center;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

.hidden {
  display: none;
}

#mouth {
  width: 400px;
  margin: auto;
  display: none;
}
</style>
</head>

<body>

<!-- SLIDE 1: INSTRUCTIONS -->
<div id="slide1">
  <p>Say <strong>"pa-ta-ka"</strong> when you see a flashing mouth.</p>
  <p>Press <strong>SPACEBAR</strong> when you are ready.</p>
</div>

<!-- SLIDE 2: COUNTDOWN -->
<div id="slide2" class="hidden">
  <p id="countdown"></p>
</div>

<!-- SLIDE 3: RECORDING -->
<div id="slide3" class="hidden">
  <img id="mouth" src="mouth1.png" />
</div>

<!-- SLIDE 4: COMPLETE -->
<div id="slide4" class="hidden">
  <p><strong>Task Complete</strong></p>
  <p>Thank you for participating.</p>
  <p>You may now return to the main page.</p>
</div>

<script>
let step = 1;
let mediaRecorder;
let chunks = [];
let flashInterval;

/* ---------- KEY HANDLING ---------- */

document.body.onkeyup = (e) => {
  if (e.code !== "Space") return;

  if (step === 1) {
    startCountdown();
  }
};

/* ---------- FLOW ---------- */

function startCountdown() {
  document.getElementById("slide1").classList.add("hidden");
  document.getElementById("slide2").classList.remove("hidden");
  step = 2;

  let c = 3;
  const countdownEl = document.getElementById("countdown");
  countdownEl.innerText = c;

  const iv = setInterval(() => {
    c--;
    if (c === 0) {
      clearInterval(iv);
      document.getElementById("slide2").classList.add("hidden");
      document.getElementById("slide3").classList.remove("hidden");
      startRecording();
    } else {
      countdownEl.innerText = c;
    }
  }, 1000);
}

/* ---------- RECORDING ---------- */

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: true,
    video: true
  });

  const mouth = document.getElementById("mouth");
  mouth.style.display = "block";

  let visible = true;
  flashInterval = setInterval(() => {
    visible = !visible;
    mouth.style.visibility = visible ? "visible" : "hidden";
  }, 200);

  chunks = [];
  mediaRecorder = new MediaRecorder(stream);

  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = () => finishRecording(stream);

  mediaRecorder.start();

  setTimeout(() => {
    mediaRecorder.stop();
  }, 20000);
}

function finishRecording(stream) {
  clearInterval(flashInterval);
  stream.getTracks().forEach(t => t.stop());

  const blob = new Blob(chunks, { type: "video/webm" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "participant_recording.webm";
  a.textContent = "Download recording";
  document.body.appendChild(a);

  showComplete();
}

/* ---------- COMPLETE ---------- */

function showComplete() {
  document.getElementById("slide3").classList.add("hidden");
  document.getElementById("slide4").classList.remove("hidden");

  // ✅ MARK EXPERIMENT AS COMPLETE
  localStorage.setItem("done_exp1", "true");

  // Auto-return to hub
  setTimeout(() => {
    window.location.href = "../index.html";
  }, 3000);
}
</script>

</body>
</html>
