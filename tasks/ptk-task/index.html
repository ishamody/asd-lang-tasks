<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PTK</title>
<style>
body { font-family: Arial; text-align: center; }
.hidden { display: none; }
</style>
</head>

<body>

<div id="slide1">
  <p>Say "pa-ta-ka"</p>
  <p>Press SPACE</p>
</div>

<div id="slide2" class="hidden"><p>Recording...</p></div>
<div id="slide3" class="hidden"><p>Done</p></div>

<script src="../upload.js"></script>
<script>
let recorder, chunks = [];

document.body.onkeyup = e => {
  if (e.code === "Space") startRecording();
};

async function startRecording() {
  document.getElementById("slide1").classList.add("hidden");
  document.getElementById("slide2").classList.remove("hidden");

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
  recorder = new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, { type: "video/webm" });

    await uploadBlob(blob, "ptk.webm", { task: "ptk" });
    showComplete();
  };

  recorder.start();
  setTimeout(() => recorder.stop(), 20000);
}

function showComplete() {
  document.getElementById("slide2").classList.add("hidden");
  document.getElementById("slide3").classList.remove("hidden");
  localStorage.setItem("done_exp1", "true");
  setTimeout(() => location.href = "../../index.html", 2000);
}
</script>
</body>
</html>
