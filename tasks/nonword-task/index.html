<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nonword Repetition Experiment</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* Flashing mouth image */
    .mouth-flash {
      width: 160px;
      margin-bottom: 20px;
      animation: mouthBlink 0.6s infinite;
    }

    @keyframes mouthBlink {
      0%   { opacity: 1; }
      50%  { opacity: 0.25; }
      100% { opacity: 1; }
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <script>
    const container = document.getElementById("container");

    const stimuli = [
      { label: "naib", file: "stimuli/naib.mp3" },
      { label: "tef",  file: "stimuli/tef.mp3"  },
      { label: "zosh", file: "stimuli/zosh.mp3" },
      { label: "plim", file: "stimuli/plim.mp3" },
      { label: "gorp", file: "stimuli/gorp.mp3" }
    ];

    let currentStim = 0;
    let recorder;
    let chunks = [];

    /* ---------- SCREENS ---------- */

    function showInstructions() {
      container.innerHTML = `
        <h2>Instructions</h2>
        <p>You will hear a made-up word.</p>
        <p>Repeat the word out loud when prompted.</p>
        <p>Your response will be recorded for 3 seconds.</p>
        <p><strong>Press SPACE to continue.</strong></p>
      `;
    }

    function showPrep() {
      container.innerHTML = `
        <h2>Get Ready</h2>
        <p>Press SPACE to hear the next word.</p>
      `;
    }

    function playStimulus() {
      container.innerHTML = `<h2>Listen…</h2>`;
      const audio = new Audio(stimuli[currentStim].file);
      audio.play();
      audio.onended = () => setTimeout(showRecording, 300);
    }

    async function showRecording() {
      container.innerHTML = `
        <img src="mouth1.png" class="mouth-flash" alt="mouth cue">
        <p>Repeat the word</p>
      `;

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      recorder = new MediaRecorder(stream);

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => saveRecording(stream);

      recorder.start();
      setTimeout(() => recorder.stop(), 3000);
    }

   async function saveRecording(stream) {
      // Stop the microphone
      stream.getTracks().forEach(t => t.stop());

      const label = stimuli[currentStim].label;
      const fileName = `response_${label}_${Date.now()}.webm`;
      
      // Ensure the blob type matches what the backend expects
      const contentType = "audio/webm"; 
      const blob = new Blob(chunks, { type: contentType });

      try {
        // 1. Get the pre-signed URL from your Flask backend
        const response = await fetch("https://asd-lang-tasks-backend-production.up.railway.app", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ file_name: fileName })
        });
        
        if (!response.ok) throw new Error("Failed to get pre-signed URL");
        const { url } = await response.json();

        // 2. Upload the Blob directly to S3
        // IMPORTANT: You MUST include the Content-Type header if the 
        // backend included 'ContentType' in the signing Params.
        const uploadResponse = await fetch(url, {
          method: "PUT",
          body: blob,
          headers: {
            "Content-Type": contentType
          }
        });

        if (uploadResponse.ok) {
          console.log(`Successfully uploaded: ${fileName}`);
        } else {
          const errorText = await uploadResponse.text();
          console.error("Upload to S3 failed:", errorText);
        }

      } catch (error) {
        console.error("Error in upload process:", error);
      }

      // Proceed to next stimulus
      currentStim++;
      if (currentStim < stimuli.length) {
        showPrep();
      } else {
        showComplete();
      }
    }

    function showComplete() {
      container.innerHTML = `
        <h2>Task Complete</h2>
        <p>Thank you for participating.</p>
        <p>You may now return to the main page.</p>
      `;

      // ✅ MARK THIS EXPERIMENT AS COMPLETE
      localStorage.setItem("done_exp2", "true");

      // optional: return to hub automatically
      setTimeout(() => {
        window.location.href = "../../index.html";
      }, 3000);
    }

    /* ---------- KEY HANDLING ---------- */

    window.addEventListener("keydown", e => {
      if (e.code !== "Space") return;

      if (container.innerText.includes("Instructions")) {
        showPrep();
      } else if (container.innerText.includes("Get Ready")) {
        playStimulus();
      }
    });

    showInstructions();
  </script>
</body>
</html>
