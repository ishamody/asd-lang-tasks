<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Nonword</title>
<style>
body, html {
  margin: 0; width: 100%; height: 100%;
  display: flex; justify-content: center; align-items: center;
  font-family: sans-serif;
}
</style>
</head>

<body>
<div id="container"></div>

<script src="../upload.js"></script>
<script>
const container = document.getElementById("container");
const stimuli = [
  { label: "naib", file: "stimuli/naib.mp3" },
  { label: "tef", file: "stimuli/tef.mp3" }
];

let currentStim = 0, recorder, chunks = [];

function playStimulus() {
  const audio = new Audio(stimuli[currentStim].file);
  audio.play();
  audio.onended = record;
}

async function record() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, { type: "audio/webm" });

    await uploadBlob(blob, `nw_${stimuli[currentStim].label}.webm`, {
      task: "nonword",
      stimulus: stimuli[currentStim].label
    });

    currentStim++;
    currentStim < stimuli.length ? playStimulus() : done();
  };

  recorder.start();
  setTimeout(() => recorder.stop(), 3000);
}

function done() {
  container.innerHTML = `<h2>Done</h2>`;
  localStorage.setItem("done_exp2", "true");
  setTimeout(() => location.href = "../../index.html", 2000);
}

playStimulus();
</script>
</body>
</html>
