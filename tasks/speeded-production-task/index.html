<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Speeded Production Task (Speaking)</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial, Helvetica, sans-serif;
    background:white;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#container{
    width:90%;
    max-width:1000px;
    text-align:center;
}

.stimulus{
    max-width:700px;
    max-height:500px;
    object-fit:contain;
}

.mic{
    width:120px;
    margin-top:20px;
}

textarea{
    width:80%;
    height:170px;
    font-size:20px;
    padding:10px;
}

button{
    font-size:22px;
    padding:12px 30px;
    margin-top:20px;
    cursor:pointer;
}

</style>

</head>

<body>

<div id="container"></div>

<script>

const container = document.getElementById("container");

/*************************************************
******************** STIMULI **********************
*************************************************/

const stimuli = [

{
    id:1,
    image:"example_from_paper.png",
    duration:1000
},

{
    id:2,
    image:"placeholder.jpg",
    duration:2500
},

{
    id:3,
    image:"placeholder.jpg",
    duration:4500
}

];


/*************************************************
******************** VARIABLES *******************
*************************************************/

let currentTrial = 0;

let results = [];

let recorder;
let chunks = [];
let currentStream = null;

let trialData = {};

// Prevent multiple starts
let experimentStarted = false;
/*************************************************
******************** INSTRUCTIONS ****************
*************************************************/

function showInstructions(){

container.innerHTML = `

<h2>Instructions</h2>

<p>
You will see a picture.
</p>

<p>
Describe the picture so that another person
could identify exactly which picture you saw.
</p>

<p>
You will only have a limited amount of time
to speak.
</p>

<p>
Afterwards you will answer two short questions.
</p>

<p>
<b>Press SPACE to begin.</b>
</p>

`;

}


/*************************************************
******************** BEGIN TRIAL *****************
*************************************************/

function beginTrial(){

trialData = {};

container.innerHTML = "";

setTimeout(showImagePreview,1000);

}


/*************************************************
******************** IMAGE PREVIEW ***************
*************************************************/

function showImagePreview(){

const stim = stimuli[currentTrial];

container.innerHTML = `

<img class="stimulus"
src="${stim.image}">

`;

setTimeout(startRecording,1000);

}


/*************************************************
******************** RECORDING *******************
*************************************************/

async function startRecording(){

    const stim = stimuli[currentTrial];

    // Hide the image while recording
    container.innerHTML = `

        <img class="mic" src="mouth.png">

        <p>
            Describe the picture.
        </p>

    `;

    try{

        currentStream = await navigator.mediaDevices.getUserMedia({
            audio:true
        });

    }catch(err){

        alert("Microphone access is required.");
        console.error(err);
        return;

    }

    chunks = [];

    recorder = new MediaRecorder(currentStream);

    recorder.ondataavailable = e => chunks.push(e.data);

    recorder.onstop = () => {
        saveRecording();
    };

    recorder.start();

    setTimeout(() => {
        recorder.stop();
    }, stim.duration);

}

/*************************************************
******************** SAVE AUDIO ******************
*************************************************/

async function saveRecording(){

currentStream
.getTracks()
.forEach(track=>track.stop());

const stim = stimuli[currentTrial];

const fileName =
`production_${stim.id}_${Date.now()}.webm`;

trialData.audioFile = fileName;

const blob =
new Blob(chunks,{
type:"audio/webm"
});

try{

    const response = await fetch(
        "https://asd-lang-tasks-backend-production.up.railway.app/get-presigned-url",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                file_name:fileName
            })
        }
    );

    if(response.ok){

        const {url} = await response.json();

        await fetch(url,{
            method:"PUT",
            body:blob,
            headers:{
                "Content-Type":"audio/webm"
            }
        });

        console.log("Uploaded",fileName);

    }

}catch(err){

    console.error(err);

}

showTimeUp();
}
/*************************************************
**************** OBJECT QUESTION *****************
*************************************************/

function showObjectQuestion(){

container.innerHTML = `

<h2>

Please type TWO objects
that appeared in the picture.

</h2>

<textarea id="objects"></textarea>

<br>

<button onclick="submitObjects()">

Continue

</button>

`;

}


function submitObjects(){

const response =
document
.getElementById("objects")
.value
.trim();

if(response===""){

alert("Please enter your response.");

return;

}

trialData.objects = response;

showDescriptionQuestion();

}


/*************************************************
************* DESCRIPTION QUESTION ***************
*************************************************/

function showDescriptionQuestion(){

container.innerHTML = `

<h2>

Please type the description
you were trying to produce.

</h2>

<textarea id="description"></textarea>

<br>

<button onclick="submitDescription()">

Continue

</button>

`;

}


function submitDescription(){

const response =
document
.getElementById("description")
.value
.trim();

if(response===""){

alert("Please enter your response.");

return;

}

trialData.description = response;

finishTrial();

}


/*************************************************
******************* FINISH TRIAL *****************
*************************************************/

function finishTrial(){

const stim = stimuli[currentTrial];

results.push({

trial:currentTrial+1,

image:stim.image,

duration:stim.duration,

audio_file:trialData.audioFile,

objects:trialData.objects,

description:trialData.description

});

currentTrial++;

if(currentTrial<stimuli.length){

beginTrial();

}
else{

saveResults();

}

}


/*************************************************
******************* SAVE RESULTS *****************
*************************************************/

async function saveResults(){

const fileName =
`production_results_${Date.now()}.json`;

const blob =
new Blob(

[
JSON.stringify(results,null,2)
],

{
type:"application/json"
}

);

try{

const response =
await fetch(

"https://asd-lang-tasks-backend-production.up.railway.app/get-presigned-url",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

file_name:fileName

})

}

);

if(response.ok){

const {url}=await response.json();

await fetch(url,{

method:"PUT",

body:blob,

headers:{

"Content-Type":"application/json"

}

});

console.log("Results uploaded.");

}

}catch(err){

console.error(err);

}

showComplete();

}


/*************************************************
******************* COMPLETE *********************
*************************************************/

function showComplete(){

container.innerHTML = `

<h2>

Task Complete

</h2>

<p>

Thank you for participating.

</p>

`;

localStorage.setItem("done_exp5","true");

setTimeout(()=>{

window.location.href="../../index.html";

},3000);

}


/*************************************************
******************** KEYBOARD ********************
*************************************************/

window.addEventListener("keydown", (e) => {

    if (e.code !== "Space") return;

    if (experimentStarted) return;

    if (container.innerText.includes("Instructions")) {
        experimentStarted = true;
        beginTrial();
    }

});

/*************************************************
******************** TIME UP *********************
*************************************************/

function showTimeUp(){

container.innerHTML = `

<h2>Time's Up!</h2>

`;

setTimeout(showObjectQuestion,500);

}

/*************************************************
******************** KEYBOARD ********************
*************************************************/

window.addEventListener("keydown", (e) => {

    if (e.code !== "Space") return;

    if (experimentStarted) return;

    if (container.innerText.includes("Instructions")) {
        experimentStarted = true;
        beginTrial();
    }

});

showInstructions();

</script>

</body>

</html>
