<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tongue Twister Experiment</title>
<style>
body, html {
  margin: 0; padding: 0; width: 100%; height: 100%;
  display: flex; justify-content: center; align-items: center;
  font-family: sans-serif;
}
#container { text-align: center; padding: 40px; }
.twister-text { font-size: 32px; margin-bottom: 30px; }
</style>
</head>

<body>
<div id="container"></div>

<script src="../upload.js"></script>
<script>
const container = document.getElementById("container");

const stimuli = [
  "She sells seashells by the seashore",
  "How can a clam cram in a clean cream can?",
  "If a dog chews shoes, whose shoes does he choose?",
  "Six sticky skeletons",
  "Red leather, yellow leather",
  "Think sticks, thick bricks",
  "Stupid superstition"
];

let currentStim = 0;
let recorder, chunks = [], stream, recording = false;

function showInstructions() {
  container.innerHTML = `<h2>Instructions</h2><p>Press space to begin.</p>`;
}

function showPrep() {
  container.innerHTML = `<h2>Get Ready</h2><p>Press space.</p>`;
}

async function showRecording() {
  container.innerHTML = `<div class="twister-text">${stimuli[currentStim]}</div>`;
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = saveRecording;
  recorder.start();
  recording = true;
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  recorder.stop();
  stream.getTracks().forEach(t => t.stop());
}

async function saveRecording() {
  const blob = new Blob(chunks, { type: "audio/webm" });

  await uploadBlob(blob, `tt_${currentStim+1}.webm`, {
    task: "tongue_twister",
    trial: currentStim + 1
  });

  currentStim++;
  currentStim < stimuli.length ? showPrep() : showComplete();
}

function showComplete() {
  container.innerHTML = `<h2>Done</h2>`;
  localStorage.setItem("done_exp3", "true");
  setTimeout(() => location.href = "../../index.html", 2000);
}

window.addEventListener("keydown", e => {
  if (e.code !== "Space") return;
  if (container.innerText.includes("Instructions")) showPrep();
  else if (container.innerText.includes("Ready")) showRecording();
  else if (recording) stopRecording();
});

showInstructions();
</script>
</body>
</html>
