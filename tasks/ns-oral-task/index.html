<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mouth Movement</title>
<style>
body, html {
  margin: 0; padding: 0; width: 100%; height: 100%;
  display: flex; justify-content: center; align-items: center;
  font-family: sans-serif;
}
#container { text-align: center; }
.black { background: black; color: white; }
</style>
</head>

<body>
<div id="container"></div>

<script src="../upload.js"></script>
<script>
const container = document.getElementById("container");
const stimuli = ["stimulus.webm"];
let currentStim = 0, recorder, chunks = [], stream;

async function showRecording() {
  container.className = "black";
  stream = await navigator.mediaDevices.getUserMedia({ video: true });
  recorder = new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = saveRecording;
  recorder.start();
  setTimeout(() => recorder.stop(), 5000);
}

async function saveRecording() {
  stream.getTracks().forEach(t => t.stop());
  const blob = new Blob(chunks, { type: "video/webm" });

  await uploadBlob(blob, `mouth_${currentStim+1}.webm`, {
    task: "mouth_movement",
    trial: currentStim + 1
  });

  currentStim++;
  currentStim < stimuli.length ? showRecording() : showComplete();
}

function showComplete() {
  container.className = "";
  container.innerHTML = `<h2>Done</h2>`;
  localStorage.setItem("done_exp4", "true");
  setTimeout(() => location.href = "../../index.html", 2000);
}

showRecording();
</script>
</body>
</html>
