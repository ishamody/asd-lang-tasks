<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mouth Movement Experiment</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 40px;
    }

    .black-screen {
      background: black;
      color: white;
    }

    #mouthBox {
      width: 250px;
      height: 120px;
      border: 2px solid white;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
    }

    video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scaleX(-1);
      width: 300px;
      height: auto;
    }

    #stimulusVideo {
      width: 300px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <script>
    const container = document.getElementById("container");

    const stimuli = ["stimulus.webm"]; // add more if needed
    let currentStim = 0;

    let stream = null;
    let recorder = null;
    let chunks = [];
    let recording = false;

    /* ---------- SCREENS ---------- */

    function showInstructions() {
      container.className = "";
      container.innerHTML = `
        <h2>Instructions</h2>
        <p>You will watch a short video showing mouth movements.</p>
        <p>After each video, you will record yourself copying the movements.</p>
        <p><strong>Only your mouth will be recorded.</strong></p>
        <p>Press <strong>space</strong> to continue.</p>
      `;
    }

    function showPrep() {
      container.className = "";
      container.innerHTML = `
        <h2>Get Ready</h2>
        <p>Press <strong>space</strong> to align your mouth.</p>
      `;
    }

    async function showCalibration() {
      container.className = "black-screen";
      container.innerHTML = "";

      stream = await navigator.mediaDevices.getUserMedia({ video: true });

      const mouthBox = document.createElement("div");
      mouthBox.id = "mouthBox";

      const video = document.createElement("video");
      video.autoplay = true;
      video.srcObject = stream;

      mouthBox.appendChild(video);
      container.appendChild(mouthBox);

      container.innerHTML += `
        <p>Align your mouth in the box.</p>
        <p>Press <strong>space</strong> when aligned.</p>
      `;
    }

    function showStimulus() {
      container.className = "";
      container.innerHTML = `
        <video id="stimulusVideo" autoplay></video>
        <p>Watch carefully.</p>
        <p>Press <strong>space</strong> to record when finished.</p>
      `;

      document.getElementById("stimulusVideo").src = stimuli[currentStim];
    }

    function showRecording() {
      container.className = "black-screen";
      container.innerHTML = "";

      const mouthBox = document.createElement("div");
      mouthBox.id = "mouthBox";

      const video = document.createElement("video");
      video.autoplay = true;
      video.srcObject = stream;

      mouthBox.appendChild(video);
      container.appendChild(mouthBox);

      container.innerHTML += `<p>Recording for 5 seconds…</p>`;

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const canvasStream = canvas.captureStream(30);
      recorder = new MediaRecorder(canvasStream, { mimeType: "video/webm" });

      chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = saveRecording;

      recorder.start();
      recording = true;

      const start = Date.now();

      function draw() {
        const box = mouthBox.getBoundingClientRect();
        const scaleX = video.videoWidth / video.clientWidth;
        const scaleY = video.videoHeight / video.clientHeight;

        const srcW = box.width * scaleX;
        const srcH = box.height * scaleY;
        const srcX = (video.videoWidth - srcW) / 2;
        const srcY = (video.videoHeight - srcH) / 2;

        canvas.width = box.width;
        canvas.height = box.height;

        ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, canvas.width, canvas.height);

        if (Date.now() - start < 5000) requestAnimationFrame(draw);
      }

      draw();
      setTimeout(() => recorder.stop(), 5000);
    }

    function saveRecording() {
      recording = false;

      const blob = new Blob(chunks, { type: "video/webm" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `mouth_${currentStim + 1}.webm`;
      document.body.appendChild(a);
      a.click();

      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      currentStim++;
      if (currentStim < stimuli.length) {
        showStimulus();
      } else {
        showComplete();
      }
    }

    function showComplete() {
      container.className = "";
      container.innerHTML = `
        <h2>Task Complete</h2>
        <p>Thank you for participating.</p>
        <p>You may now return to the main page.</p>
      `;

      // ✅ mark experiment complete
      localStorage.setItem("done_exp4", "true");

      setTimeout(() => {
        window.location.href = "../../index.html";
      }, 3000);
    }

    /* ---------- KEY HANDLING ---------- */

    window.addEventListener("keydown", e => {
      if (e.code !== "Space") return;

      if (container.innerText.includes("Instructions")) {
        showPrep();
      } else if (container.innerText.includes("Get Ready")) {
        showCalibration();
      } else if (container.innerText.includes("Align your mouth")) {
        showStimulus();
      } else if (container.innerText.includes("Watch carefully")) {
        showRecording();
      }
    });

    showInstructions();
  </script>
</body>
</html>
