<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tongue Twister Experiment</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 40px;
    }

    .twister-text {
      font-size: 32px;
      font-weight: 600;
      max-width: 900px;
      line-height: 1.4;
      margin-bottom: 30px;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <script>
    const container = document.getElementById("container");

    const stimuli = [
      "She sells seashells by the seashore",
      "How can a clam cram in a clean cream can?",
      "If a dog chews shoes, whose shoes does he choose?",
      "Six sticky skeletons",
      "Red leather, yellow leather",
      "Think sticks, thick bricks",
      "Stupid superstition"
    ];

    let currentStim = 0;
    let recorder = null;
    let chunks = [];
    let stream = null;
    let recording = false;

    /* ---------- SCREENS ---------- */

    function showInstructions() {
      container.innerHTML = `
        <h2>Instructions</h2>
        <p>Say each tongue twister <strong>three times</strong> as fast and as accurately as you can.</p>
        <p>Press the <strong>space bar</strong> to continue.</p>
      `;
    }

    function showPrep() {
      container.innerHTML = `
        <h2>Get Ready</h2>
        <p>Press the <strong>space bar</strong> when you’re ready.</p>
      `;
    }

    async function showRecording() {
      const text = stimuli[currentStim];

      container.innerHTML = `
        <div class="twister-text">${text}</div>
        <p>Say this tongue twister <strong>3 times</strong>.</p>
        <p>Press <strong>space</strong> when finished.</p>
      `;

      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];

      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = saveRecording;

      recorder.start();
      recording = true;
    }

    function stopRecording() {
      if (!recording) return;
      recording = false;
      recorder.stop();
      stream.getTracks().forEach(t => t.stop());
    }

    function saveRecording() {
      const blob = new Blob(chunks, { type: "audio/webm" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `twister_${currentStim + 1}.webm`;
      document.body.appendChild(a);
      a.click();

      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      currentStim++;
      if (currentStim < stimuli.length) {
        showPrep();
      } else {
        showComplete();
      }
    }

    function showComplete() {
      container.innerHTML = `
        <h2>Task Complete</h2>
        <p>Thank you for participating.</p>
        <p>You may now return to the main page.</p>
      `;

      // ✅ MARK THIS EXPERIMENT AS COMPLETE
      localStorage.setItem("done_exp2", "true");

      // optional: return to hub automatically
      setTimeout(() => {
        window.location.href = "../index.html";
      }, 3000);
    }


    /* ---------- KEY HANDLING ---------- */

    window.addEventListener("keydown", e => {
      if (e.code !== "Space") return;

      if (container.innerText.includes("Instructions")) {
        showPrep();
      } else if (container.innerText.includes("Get Ready")) {
        showRecording();
      } else if (recording) {
        stopRecording();
      }
    });

    showInstructions();
  </script>
</body>
</html>
